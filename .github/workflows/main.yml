name: YouTube Long Audiobook Automation

on:
  schedule:
    # Din mein 1 baar chalega (Best Peak Indian Time - 6:30 PM IST / 1:00 PM UTC)
    - cron: '0 13 * * *' 
  workflow_dispatch: # Manual 'Run Workflow' button ke liye

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # Long video render ke liye max 2 hours ka time

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # FFmpeg aur ImageMagick dono install kar rahe hain
      - name: Install System Dependencies (FFmpeg & ImageMagick)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick
          sudo sed -i '/<policy domain="path" rights="none" pattern="@\*"/d' /etc/ImageMagick-6/policy.xml

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Audiobook Automation Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          python ai.py